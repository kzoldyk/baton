[package]
name = "baton"
version = "0.1.0"
description = "Baton core — session continuity for local AI CLIs"
edition = "2021"
publish = false

[lib]
name = "baton_lib"
path = "src/lib.rs"

[[bin]]
name = "baton"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
